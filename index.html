<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Photo Finish: Dice Derby</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2a1d;--felt:#16402b;--felt2:#1d5136;--cream:#f6efdc;--gold:#e8b54a;--ink:#0b1a12;--muted:#a9c2b3;--line:rgba(246,239,220,.14);--red:#ff8a85;--green:#9be3a8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{background:radial-gradient(ellipse at top,#1b4a33,var(--bg) 70%) fixed;color:var(--cream);font-family:Inter,system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:15px}
.wrap{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 10px 150px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
h1{font-family:Fraunces,serif;font-weight:900;font-size:24px;letter-spacing:-.5px;line-height:1}
h1 span{color:var(--gold)}
h2{font-family:Fraunces,serif;font-size:17px;margin:12px 0 8px}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.pill{font-size:12px;background:rgba(232,181,74,.15);color:var(--gold);padding:5px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.card{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
button{font:inherit;cursor:pointer;border-radius:10px;padding:11px 12px;font-weight:700;background:var(--felt2);color:var(--cream);border:1px solid var(--line);touch-action:manipulation}
button:active{transform:scale(.97)}
button.primary{background:var(--gold);color:var(--ink);border-color:transparent}
button.sel{background:var(--cream);color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;font-size:16px;background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.center{text-align:center}
.hide{display:none!important}
/* track */
.track{display:flex;flex-direction:column;gap:3px}
.lane{display:grid;grid-template-columns:38px 1fr;gap:6px;align-items:center}
.lab{font-family:Fraunces,serif;font-weight:900;font-size:13px;text-align:center;border-radius:6px;padding:2px 0;color:var(--ink)}
.cells{display:flex;gap:2px;height:20px;position:relative}
.cell{flex:1;border-radius:4px;background:rgba(246,239,220,.07);position:relative}
.cell.fin{background:repeating-conic-gradient(#f6efdc 0 25%,#0b1a12 0 50%) 0 0/7px 7px;opacity:.5}
.cell.on{background:rgba(246,239,220,.2)}
.cell.half{border-left:2px dashed rgba(232,181,74,.6)}
.horse{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
.lane.hot .lab{box-shadow:0 0 0 2px var(--cream)}
.lane.first .lab{box-shadow:0 0 0 3px var(--gold)}
.dice{display:flex;gap:8px;justify-content:center;align-items:center;margin:2px 0 8px;min-height:36px}
.die{width:32px;height:32px;background:var(--cream);color:var(--ink);border-radius:8px;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:900;font-size:18px;box-shadow:0 2px 0 #c9bf9f}
.sum{font-family:Fraunces,serif;font-size:18px;color:var(--gold);min-width:44px;text-align:center}
.status{text-align:center;font-weight:700;font-size:13px;color:var(--muted)}
.banner{border-radius:10px;padding:8px 10px;margin-top:8px;font-weight:800;font-size:13px;text-align:center}
.banner.open{background:rgba(155,227,168,.15);color:var(--green)}
.banner.closed{background:rgba(255,138,133,.15);color:var(--red)}
/* board */
.board{display:grid;grid-template-columns:40px repeat(3,1fr);gap:4px}
.bh{font-size:11px;color:var(--muted);text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-bottom:2px}
.sq{position:relative;min-height:46px;border-radius:9px;border:1.5px solid var(--line);background:rgba(11,26,18,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;cursor:pointer;color:var(--cream);font-weight:800}
.sq .m{font-family:Fraunces,serif;font-size:17px;line-height:1}
.sq .pen{font-size:10px;color:var(--red);font-weight:800;margin-top:2px}
.sq.taken{cursor:default}
.sq.can{border-color:rgba(232,181,74,.55)}
.sq.hit{background:rgba(155,227,168,.22);border-color:var(--green)}
.sq.miss{opacity:.45}
.tok{position:absolute;inset:3px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:900;color:var(--ink);font-size:13px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.tok b{font-family:Fraunces,serif;font-size:18px}
.tok i{font-style:normal;font-size:11px;opacity:.8;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl{display:flex;align-items:center;justify-content:center}
.side{display:grid;grid-template-columns:1fr 70px;gap:4px;align-items:stretch;margin-bottom:4px}
.side .desc{background:rgba(11,26,18,.35);border-radius:9px;padding:7px 9px;font-size:13px;font-weight:600;display:flex;align-items:center;line-height:1.3}
/* players */
.pl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.pl:last-child{border-bottom:none}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px}
.off{opacity:.45}
.cash{font-variant-numeric:tabular-nums;font-weight:800}
.pos{color:var(--green)}.neg{color:var(--red)}
.res{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.res:last-child{border-bottom:none}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(11,26,18,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
.dock .in{max-width:640px;margin:0 auto}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.toks{display:flex;gap:8px}
.tk{flex:1;height:52px;border-radius:12px;font-family:Fraunces,serif;font-size:24px;font-weight:900;color:var(--ink);border:3px solid transparent;padding:0}
.tk.sel{border-color:var(--cream);box-shadow:0 0 0 2px var(--ink) inset;transform:translateY(-3px)}
.tk.used{opacity:.2}
.hostbar{display:flex;gap:8px;margin-top:8px}
.code{font-family:Fraunces,serif;font-size:38px;font-weight:900;letter-spacing:6px;color:var(--gold);margin:4px 0}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px;z-index:9;transition:opacity .3s}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Photo <span>Finish</span></h1><div id="pill" class="pill">Dice Derby</div></header>
  <div id="joinCard" class="card hide">
    <h2 style="margin-top:0">Your name</h2>
    <div class="row"><input id="nick" maxlength="12" placeholder="Name" autocomplete="off"><button class="primary" id="joinBtn">Join</button></div>
  </div>
  <div id="main"></div>
</div>
<div class="dock hide" id="dock"><div class="in" id="dockIn"></div></div>
<div class="toast hide" id="toast"></div>

<script>
// ================= Rules & constants =================
const H=[{k:'2·3',c:'#e05a5a'},{k:'4',c:'#f08a3c'},{k:'5',c:'#efc94c'},{k:'6',c:'#8fd16b'},{k:'7',c:'#4cc9b0'},{k:'8',c:'#5aa7e0'},{k:'9',c:'#8b7fe8'},{k:'10',c:'#d07ad6'},{k:'11·12',c:'#f2a7c3'}];
const DIST=[6,6,7,7,7,7,7,6,6];          // spaces to the finish line
const HALF=i=>Math.ceil(DIST[i]/2);      // betting closes when any horse reaches its halfway mark
const TOKENS=[2,3,3,4,5];                // each player's betting tokens, every race
const STEP=1100;                         // ms between rolls
const PCOL=['#e8b54a','#5ad1e8','#ff8fb1','#b4e86b','#c89bff','#ff9f5a','#7fe0c0','#f2f2f2'];
const COLS={w:'Win',p:'Place',s:'Show'},TOPN={w:1,p:2,s:3};
const GROUPS={L:{label:'Low',hs:[0,1,2]},M:{label:'Mid',hs:[3,4,5]},X:{label:'High',hs:[6,7,8]}};
const horseOf=s=>s<=3?0:s>=11?8:s-3;
const d6=()=>1+Math.floor(Math.random()*6);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
const money=n=>(n<0?'−$':'$')+Math.abs(n);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// Prop bets: a few are drawn at random each race
const PROPS=[
  ()=>({k:'longshot',t:'A long shot wins (2·3, 4, 10 or 11·12)'}),
  ()=>({k:'favout',t:'The 7 misses the top 3'}),
  ()=>({k:'photo',t:'Photo finish: 2nd place ends 1 space from the line'}),
  ()=>{const x=pick([2,3,5,6]);return{k:'gate',a:[x],t:`The ${H[x].k} never leaves the gate`}},
  ()=>{const x=pick([0,1,2,6,7,8]);return{k:'last',a:[x],t:`The ${H[x].k} finishes dead last`}},
  ()=>{const xs=[...Array(9).keys()].sort(()=>Math.random()-.5).slice(0,2);return{k:'pair',a:xs,t:`Both the ${H[xs[0]].k} and the ${H[xs[1]].k} finish top 3`}},
  ()=>({k:'long',t:'Marathon: the race takes 34+ rolls'}),
  ()=>({k:'short',t:'Sprint: the race ends in 24 rolls or fewer'}),
  ()=>{const x=pick([3,5]);return{k:'beats',a:[x,4],t:`The ${H[x].k} finishes ahead of the 7`}},
];

// ================= Race model =================
function rankOf(pos,stamp){return [...Array(9).keys()].sort((a,b)=>(pos[b]/DIST[b]-pos[a]/DIST[a])||(stamp[a]-stamp[b]));}
function outcomeOf(pos,stamp,n){const rk=rankOf(pos,stamp);return{rk,pos,n};}
function hits(sq,o){ // does square sq pay given outcome o?
  const {rk,pos,n}=o;
  if(sq.t==='h')return rk.slice(0,TOPN[sq.c]).includes(sq.h);
  if(sq.t==='g')return GROUPS[sq.g].hs.includes(rk[0]);
  const a=sq.a||[];
  switch(sq.k){
    case 'longshot':return [0,1,7,8].includes(rk[0]);
    case 'favout':return !rk.slice(0,3).includes(4);
    case 'photo':return DIST[rk[1]]-pos[rk[1]]<=1;
    case 'gate':return pos[a[0]]===0;
    case 'last':return rk[8]===a[0];
    case 'pair':return rk.slice(0,3).includes(a[0])&&rk.slice(0,3).includes(a[1]);
    case 'long':return n>=34;
    case 'short':return n<=24;
    case 'beats':return rk.indexOf(a[0])<rk.indexOf(a[1]);
  }
  return false;
}
function simRace(){
  const pos=Array(9).fill(0),stamp=Array(9).fill(0);let n=0;
  while(true){const h=horseOf(d6()+d6());n++;pos[h]++;stamp[h]=n;if(pos[h]>=DIST[h])break;}
  return outcomeOf(pos,stamp,n);
}
// Build this race's board: multipliers and penalties come from simulated odds
function buildBoard(){
  const sqs={};
  H.forEach((h,i)=>Object.keys(COLS).forEach(c=>sqs['h'+i+c]={t:'h',h:i,c}));
  Object.keys(GROUPS).forEach(g=>sqs['g'+g]={t:'g',g});
  const used=new Set();let props=[];
  while(props.length<3){const p=pick(PROPS)();if(used.has(p.k))continue;used.add(p.k);props.push(p);}
  props.forEach((p,i)=>sqs['p'+i]={t:'p',k:p.k,a:p.a,txt:p.t});
  const N=6000,cnt={};for(const id in sqs)cnt[id]=0;
  for(let i=0;i<N;i++){const o=simRace();for(const id in sqs)if(hits(sqs[id],o))cnt[id]++;}
  for(const id in sqs){const p=Math.max(cnt[id]/N,0.004);
    sqs[id].m=Math.max(1,Math.min(40,Math.round(0.7/p)));
    sqs[id].pen=p<0.08?2:p<0.2?1:0;}
  return sqs;
}

// ================= Runtime / identity =================
let role=null,isHost=false,peerObj=null,hostConn=null,code=null,netMsg='';
const PFX='photofinish-dd-',conns={};
let myId=null;try{myId=localStorage.getItem('pf_pid')}catch(e){}
if(!myId){myId=Math.random().toString(36).slice(2,12);try{localStorage.setItem('pf_pid',myId)}catch(e){}}
let myNick='';try{myNick=localStorage.getItem('pf_nick')||''}catch(e){}
let G=null,online={},selTok=null;

const me=()=>G&&G.roster&&G.roster[myId];
const usedToks=id=>new Set(Object.values(G.claims||{}).filter(c=>c.id===id).map(c=>c.ti));
const bettingOpen=()=>G&&(G.phase==='bet'||(G.phase==='race'&&G.open));

// ================= Host engine (host's phone is the source of truth) =================
function hostWrite(next){
  G=next;try{localStorage.setItem('pf_host',JSON.stringify({code,G}))}catch(e){}
  broadcast({type:'state',G});render();
}
function hostNewGame(races){
  hostWrite({game:Math.random().toString(36).slice(2,8),phase:'lobby',races:races||(G&&G.races)||4,race:0,roster:G&&G.phase!=='final'?{}:resetRoster(),board:null,claims:{},rolls:[],open:true,results:null});
}
function resetRoster(){const r={};if(G&&G.roster)for(const id in G.roster)r[id]={...G.roster[id],cash:0};return r;}
function hostAddPlayer(id,nick){
  if(!G)return;nick=String(nick||'').trim().slice(0,12);if(!nick)return;
  const s=clone(G);
  if(s.roster[id]){if(s.roster[id].nick===nick)return;s.roster[id].nick=nick;}
  else{if(s.phase==='final')return;const usedC=Object.values(s.roster).map(p=>p.col);s.roster[id]={nick,cash:0,col:PCOL.find(c=>!usedC.includes(c))||pick(PCOL)};}
  hostWrite(s);
}
function hostClaim(id,sq,ti){
  if(!G||!G.roster[id]||!bettingOpen())return 'Betting is closed';
  if(!G.board[sq])return 'No such square';
  if(G.claims[sq])return 'Someone beat you to it';
  if(!(ti>=0&&ti<TOKENS.length))return 'Pick a token';
  if(usedToks(id).has(ti))return 'Token already used';
  const s=clone(G);s.claims[sq]={id,ti,v:TOKENS[ti]};hostWrite(s);return null;
}
function hostUnclaim(id,sq){ // only before the race starts
  if(!G||G.phase!=='bet'||!G.claims[sq]||G.claims[sq].id!==id)return;
  const s=clone(G);delete s.claims[sq];hostWrite(s);
}
function hostOpenBetting(){
  const s=clone(G);s.race++;s.phase='bet';s.board=buildBoard();s.claims={};s.rolls=[];s.open=true;s.results=null;hostWrite(s);
}
let raceTimer=null;
function replay(rolls){const pos=Array(9).fill(0),stamp=Array(9).fill(0);rolls.forEach((r,i)=>{const h=horseOf(Math.floor(r/10)+r%10);pos[h]=Math.min(DIST[h],pos[h]+1);stamp[h]=i+1;});return{pos,stamp};}
function hostStartRace(){const s=clone(G);s.phase='race';s.open=true;hostWrite(s);clearInterval(raceTimer);raceTimer=setInterval(hostRoll,STEP);}
function hostRoll(){
  if(!G||G.phase!=='race'){clearInterval(raceTimer);return;}
  const s=clone(G);const a=d6(),b=d6(),h=horseOf(a+b);s.rolls.push(a*10+b);
  const {pos,stamp}=replay(s.rolls);
  if(s.open&&pos.some((p,i)=>p>=HALF(i)))s.open=false;
  if(pos[h]>=DIST[h]){clearInterval(raceTimer);s.open=false;settle(s,pos,stamp);}
  hostWrite(s);
}
function settle(s,pos,stamp){
  const o=outcomeOf(pos,stamp,s.rolls.length);const lines=[];
  for(const sq in s.claims){const c=s.claims[sq],b=s.board[sq],hit=hits(b,o);const d=hit?c.v*b.m:-b.pen;
    if(s.roster[c.id])s.roster[c.id].cash+=d;lines.push({sq,id:c.id,v:c.v,hit,d});}
  s.results={rk:o.rk.slice(0,3),lines,hit:Object.keys(s.board).filter(id=>hits(s.board[id],o))};
  s.phase='results';
}
function hostNext(){if(G.race>=G.races){const s=clone(G);s.phase='final';hostWrite(s);}else hostOpenBetting();}
function hostRestart(){const s=clone(G);s.phase='lobby';s.race=0;s.board=null;s.claims={};s.rolls=[];s.results=null;for(const id in s.roster)s.roster[id].cash=0;hostWrite(s);}
function hostSetRaces(n){const s=clone(G);s.races=n;hostWrite(s);}

// ================= Player actions (routed to host) =================
function send(m){if(isHost)hostHandle(myId,m);else if(hostConn&&hostConn.open){try{hostConn.send(m)}catch(e){}}}
function tapSquare(sq){
  if(!me())return;
  const c=G.claims[sq];
  if(c){if(c.id===myId&&G.phase==='bet')send({type:'unclaim',sq});return;}
  if(!bettingOpen())return toast('Betting is closed');
  if(selTok===null||usedToks(myId).has(selTok)){const free=TOKENS.map((v,i)=>i).filter(i=>!usedToks(myId).has(i));if(!free.length)return toast('All your tokens are out');selTok=free[free.length-1];}
  send({type:'claim',sq,ti:selTok});
  const left=TOKENS.map((v,i)=>i).filter(i=>i!==selTok&&!usedToks(myId).has(i));selTok=left.length?left[left.length-1]:null;
}
function pickTok(i){selTok=i;renderDock();}
function join(){const v=$('nick').value.trim().slice(0,12);if(!v)return;myNick=v;try{localStorage.setItem('pf_nick',v)}catch(e){}send({type:'nick',nick:v});render();}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.add('hide'),1800);}

// ================= Networking (peer-to-peer) =================
function broadcast(m){Object.values(conns).forEach(c=>{try{if(c.open)c.send(m)}catch(e){}});}
function sendOnline(){online={[myId]:true};Object.keys(conns).forEach(id=>online[id]=true);broadcast({type:'online',ids:Object.keys(online)});render();}
function hostHandle(id,m){
  if(!m||typeof m!=='object')return;
  if(m.type==='nick')hostAddPlayer(id,m.nick);
  if(m.type==='claim'){const err=hostClaim(id,String(m.sq),m.ti|0);if(err){if(id===myId)toast(err);else{const c=conns[id];try{c&&c.send({type:'err',msg:err})}catch(e){}}}}
  if(m.type==='unclaim')hostUnclaim(id,String(m.sq));
}
function onHostConn(conn){
  conn.on('data',m=>{
    if(m&&m.type==='hello'&&typeof m.pid==='string'){const id=m.pid.slice(0,24);if(id===myId)return;conn.pid=id;
      if(conns[id]&&conns[id]!==conn){try{conns[id].close()}catch(e){}}conns[id]=conn;
      try{conn.send({type:'state',G})}catch(e){}
      if(m.nick)hostAddPlayer(id,m.nick);sendOnline();return;}
    if(conn.pid)hostHandle(conn.pid,m);
  });
  conn.on('close',()=>{if(conn.pid&&conns[conn.pid]===conn){delete conns[conn.pid];sendOnline();}});
}
function openHostPeer(){
  netMsg='Opening table…';render();
  peerObj=new Peer(PFX+code);
  peerObj.on('open',()=>{netMsg='';render();});
  peerObj.on('connection',onHostConn);
  peerObj.on('disconnected',()=>{try{peerObj.reconnect()}catch(e){}});
  peerObj.on('error',e=>{if(e.type==='unavailable-id'){netMsg='Reclaiming your table…';render();try{peerObj.destroy()}catch(x){}setTimeout(openHostPeer,4000);}else{netMsg='Connection hiccup: '+e.type;render();}});
}
function startHost(resume){
  role='host';isHost=true;
  if(resume&&resume.G&&resume.G.claims){code=resume.code;G=resume.G;}
  else code=Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');
  if(!myNick)myNick='Host';
  history.replaceState(null,'',location.pathname);
  openHostPeer();
  if(!G)hostNewGame(4);
  hostAddPlayer(myId,myNick);online={[myId]:true};
  if(G.phase==='race'){clearInterval(raceTimer);raceTimer=setInterval(hostRoll,STEP);}
  render();
}
let retryT=null;
function scheduleRetry(ms){clearTimeout(retryT);retryT=setTimeout(connectHost,ms);}
function connectHost(){
  if(!peerObj||peerObj.destroyed)return;
  if(peerObj.disconnected){try{peerObj.reconnect()}catch(e){}scheduleRetry(2500);return;}
  if(hostConn&&hostConn.open)return;
  const c=peerObj.connect(PFX+code,{reliable:true});hostConn=c;
  c.on('open',()=>{netMsg='';c.send({type:'hello',pid:myId,nick:myNick});render();});
  c.on('data',m=>{if(!m||typeof m!=='object')return;
    if(m.type==='state'){G=m.G?clone(m.G):null;render();}
    if(m.type==='online'&&Array.isArray(m.ids)){online={};m.ids.forEach(i=>online[i]=true);render();}
    if(m.type==='err')toast(String(m.msg).slice(0,60));});
  c.on('close',()=>{if(hostConn===c){netMsg='Reconnecting…';render();scheduleRetry(2000);}});
}
function startPlayer(c){
  role='player';code=c.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  try{localStorage.removeItem('pf_host')}catch(e){}
  netMsg='Connecting to table '+code+'…';render();
  peerObj=new Peer();
  peerObj.on('open',connectHost);
  peerObj.on('disconnected',()=>{try{peerObj.reconnect()}catch(e){}});
  peerObj.on('error',e=>{netMsg=e.type==='peer-unavailable'?'Can\'t find table '+code+'. Check the code and make sure the host has the page open.':'Connection hiccup ('+e.type+'), retrying…';render();scheduleRetry(4000);});
}
const shareURL=()=>location.origin+location.pathname+'?join='+code;
function copyLink(btn){const u=shareURL();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{btn.textContent='Copied!'},()=>prompt('Copy this link:',u));}

// ================= Render =================
function render(){
  $('pill').textContent=!G?'Dice Derby':G.phase==='lobby'?'Table '+code:G.phase==='final'?'Final':`Race ${G.race}/${G.races}`;
  const showJoin=G&&role&&(!myNick||!me())&&G.phase!=='final';
  $('joinCard').classList.toggle('hide',!showJoin);
  if(showJoin&&!$('nick').value&&document.activeElement!==$('nick'))$('nick').value=myNick;
  $('main').innerHTML=view();renderDock();
}
function view(){
  if(!role)return homeHTML();
  if(!G)return `<div class="card center note">${esc(netMsg||'Connecting…')}</div>`;
  let out=netMsg?`<div class="banner closed">${esc(netMsg)}</div>`:'';
  out+=hostBar();
  if(G.phase==='lobby')return out+lobbyHTML();
  if(G.phase==='final')return out+finalHTML();
  out+=trackHTML();
  if(G.phase==='bet')out+=`<div class="banner open">Betting open. Tap a square to drop a token${me()?'. Tap your own token to take it back before the start':''}.</div>`;
  if(G.phase==='race')out+=G.open?`<div class="banner open">🟢 Betting still open, closes when a horse reaches the halfway line</div>`:`<div class="banner closed">🔒 Betting closed</div>`;
  if(G.phase==='results')out+=resultsHTML();
  return out+boardHTML()+playersHTML();
}
function hostBar(){
  if(!isHost)return '';
  const b=(label,fn,dis)=>`<button class="primary grow" ${dis?'disabled':''} onclick="${fn}">${label}</button>`;
  let x='';
  if(G.phase==='lobby')x=b('Start game','hostOpenBetting()',Object.keys(G.roster).length<1);
  if(G.phase==='bet')x=b(`🏁 Start race ${G.race}`,'hostStartRace()');
  if(G.phase==='race')x=`<div class="grow status">Race running…</div>`;
  if(G.phase==='results')x=b(G.race>=G.races?'Final standings':'Next race →','hostNext()');
  if(G.phase==='final')x=b('Play again','hostRestart()');
  return `<div class="hostbar">${x}</div>`;
}
function trackHTML(){
  const {pos,stamp}=replay(G.rolls||[]);const last=G.rolls&&G.rolls.length?G.rolls[G.rolls.length-1]:null;
  const done=G.phase==='results';const rk=done?rankOf(pos,stamp):[];
  const lastH=last?horseOf(Math.floor(last/10)+last%10):-1;
  return `<div class="card">
  <div class="dice">${last?`<div class="die">${Math.floor(last/10)}</div><div class="die">${last%10}</div><div class="sum">= ${Math.floor(last/10)+last%10}</div><div class="note" style="margin-left:6px">roll ${G.rolls.length}</div>`:`<div class="status">${G.phase==='bet'?'Waiting at the gate…':''}</div>`}</div>
  <div class="track">${H.map((h,i)=>`<div class="lane ${rk[0]===i?'first':(!done&&i===lastH?'hot':'')}"><div class="lab" style="background:${h.c}">${h.k}</div>
  <div class="cells">${Array.from({length:DIST[i]},(_,j)=>`<div class="cell ${j===DIST[i]-1?'fin':''} ${j<pos[i]?'on':''} ${j===HALF(i)-1?'half':''}">${pos[i]>0&&j===pos[i]-1?'<div class="horse">🐎</div>':''}</div>`).join('')}</div></div>`).join('')}</div></div>`;
}
function sqHTML(id){
  const b=G.board[id],c=G.claims[id],R=G.results;
  const st=R?(R.hit.includes(id)?'hit':'miss'):'';
  const can=!c&&bettingOpen()&&me();
  let inner=c?(()=>{const p=G.roster[c.id]||{nick:'?',col:'#888'};return `<div class="tok" style="background:${p.col}"><b>${c.v}</b><i>${esc(p.nick)}</i></div>`})():`<div class="m">×${b.m}</div>${b.pen?`<div class="pen">−$${b.pen}</div>`:''}`;
  return `<div class="sq ${c?'taken':''} ${can?'can':''} ${st}" onclick="tapSquare('${id}')">${inner}</div>`;
}
function boardHTML(){
  if(!G.board)return '';
  return `<div class="card"><div class="board">
  <div></div>${Object.values(COLS).map(c=>`<div class="bh">${c}</div>`).join('')}
  ${H.map((h,i)=>`<div class="hl"><div class="lab" style="background:${h.c};width:100%">${h.k}</div></div>${Object.keys(COLS).map(c=>sqHTML('h'+i+c)).join('')}`).join('')}
  </div>
  <h3>Winner's group</h3>
  <div class="board" style="grid-template-columns:repeat(3,1fr)">${Object.keys(GROUPS).map(g=>`<div><div class="bh">${GROUPS[g].label} · ${GROUPS[g].hs.map(i=>H[i].k).join(' ')}</div>${sqHTML('g'+g)}</div>`).join('')}</div>
  <h3>Side bets</h3>
  ${[0,1,2].map(i=>`<div class="side"><div class="desc">${esc(G.board['p'+i].txt)}</div>${sqHTML('p'+i)}</div>`).join('')}
  <div class="note" style="margin-top:6px">Win = 1st · Place = top 2 · Show = top 3. A hit pays token × multiplier. A miss on a square with a red <span style="color:var(--red)">−$</span> costs you that much. One token per square.</div>
  </div>`;
}
function playersHTML(){
  const ids=Object.keys(G.roster).sort((a,b)=>G.roster[b].cash-G.roster[a].cash);
  return `<div class="card"><h3 style="margin-top:0">Table</h3>${ids.map(id=>{const p=G.roster[id];const n=Object.values(G.claims||{}).filter(c=>c.id===id).length;
  return `<div class="pl ${online[id]?'':'off'}"><span><span class="sw" style="background:${p.col}"></span>${esc(p.nick)}${id===myId?' (you)':''}${G.phase!=='lobby'&&G.phase!=='final'?` <span class="note">· ${n}/${TOKENS.length} tokens out</span>`:''}</span><span class="cash ${p.cash<0?'neg':''}">${money(p.cash)}</span></div>`}).join('')}</div>`;
}
function resultsHTML(){
  const R=G.results;const mine=R.lines.filter(l=>l.id===myId);const net=mine.reduce((s,l)=>s+l.d,0);
  const name=sq=>{const b=G.board[sq];return b.t==='h'?`${H[b.h].k} ${COLS[b.c]}`:b.t==='g'?`${GROUPS[b.g].label} group`:b.txt;};
  return `<div class="card"><h2 style="margin-top:0">Race ${G.race} results</h2>
  <div class="row" style="gap:6px;margin-bottom:8px">${R.rk.map((h,i)=>`<div class="grow center" style="background:${H[h].c};color:var(--ink);border-radius:10px;padding:7px 0;font-weight:900;font-family:Fraunces,serif">${['🥇','🥈','🥉'][i]} ${H[h].k}</div>`).join('')}</div>
  ${me()?(mine.length?mine.map(l=>`<div class="res"><span>${l.v}-token on ${esc(name(l.sq))}</span><b class="${l.d>0?'pos':l.d<0?'neg':''}">${l.d>0?'+$'+l.d:l.d<0?'−$'+(-l.d):'$0'}</b></div>`).join('')+`<div class="res"><b>Your race</b><b class="${net>=0?'pos':'neg'}">${net>=0?'+':'−'}$${Math.abs(net)}</b></div>`:'<div class="note">You didn\'t place any tokens this race.</div>'):''}
  </div>`;
}
function lobbyHTML(){
  return `${isHost?`<div class="card center"><div class="note">Friends join with this code, or the link</div><div class="code">${esc(code)}</div>
  <div class="note" style="word-break:break-all;margin-bottom:8px">${esc(shareURL())}</div><button style="width:100%" onclick="copyLink(this)">Copy invite link</button>
  <h3>Races</h3><div class="row">${[3,4,5,6].map(n=>`<button class="grow ${G.races===n?'sel':''}" onclick="hostSetRaces(${n})">${n}</button>`).join('')}</div>
  <div class="note" style="margin-top:8px">Keep this page open while you play. Your phone runs the table.</div></div>`:`<div class="card center note">${G.races} races. Waiting for the host to start…</div>`}
  ${playersHTML()}${howHTML()}`;
}
function finalHTML(){
  const ids=Object.keys(G.roster).sort((a,b)=>G.roster[b].cash-G.roster[a].cash);
  return `<div class="card center"><div style="font-size:46px">🏆</div><h2 style="margin-top:2px">${esc(G.roster[ids[0]]?.nick||'Nobody')} takes the purse!</h2></div>${playersHTML()}`;
}
function howHTML(){return `<div class="card"><h3 style="margin-top:0">How to play</h3><div class="note">
Each race, two dice roll over and over and the horse matching the total moves one space (2·3 and 11·12 share a horse). Rare numbers have shorter tracks.<br><br>
You get betting tokens worth <b>2, 3, 3, 4, 5</b> every race. Drop them on squares: Win, Place, Show, the winner's group, or the side bets. <b>Each square holds one token, first come first served</b>, and everyone can see who's where.<br><br>
Betting stays open while the horses run until any horse reaches the dashed halfway line, so waiting gives you better info but fewer squares. A hit pays <b>token × multiplier</b>. Red <span style="color:var(--red)">−$</span> squares charge you if they miss. Most cash after the last race wins.</div></div>`;}
function homeHTML(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem('pf_host'))}catch(e){}
  return `<div class="card"><h2 style="margin-top:0">Host a table</h2><div class="note" style="margin-bottom:10px">You run the race and friends join from their phones. No accounts needed.</div>
  <button class="primary" style="width:100%" onclick="startHost()">Host a new game</button>
  ${saved&&saved.code&&saved.G&&saved.G.claims&&saved.G.phase!=='final'?`<button style="width:100%;margin-top:8px" onclick='startHost(JSON.parse(localStorage.getItem("pf_host")))'>Resume table ${esc(saved.code)}</button>`:''}</div>
  <div class="card"><h2 style="margin-top:0">Join a table</h2><div class="row"><input id="codeIn" maxlength="8" placeholder="Table code" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"><button class="primary" onclick="const v=document.getElementById('codeIn').value.trim();if(v)startPlayer(v)">Join</button></div></div>
  ${howHTML()}`;
}
function renderDock(){
  const d=$('dock');const p=me();
  if(!G||!p||G.phase==='lobby'||G.phase==='final'){d.classList.add('hide');return;}
  d.classList.remove('hide');
  const used=usedToks(myId);
  if(selTok!==null&&used.has(selTok))selTok=null;
  if(selTok===null){const free=TOKENS.map((v,i)=>i).filter(i=>!used.has(i));selTok=free.length?free[free.length-1]:null;}
  $('dockIn').innerHTML=`<div class="dtop"><span><span class="sw" style="background:${p.col}"></span>${esc(p.nick)} · <span class="cash ${p.cash<0?'neg':''}">${money(p.cash)}</span></span><span>${bettingOpen()?(selTok!==null?`Next drop: ${TOKENS[selTok]}-token`:'All tokens placed'):'Betting closed'}</span></div>
  <div class="toks">${TOKENS.map((v,i)=>`<button class="tk ${used.has(i)?'used':''} ${i===selTok?'sel':''}" style="background:${p.col}" ${used.has(i)?'disabled':''} onclick="pickTok(${i})">${v}</button>`).join('')}</div>`;
}

// ================= Boot =================
$('joinBtn').onclick=join;$('nick').addEventListener('keydown',e=>{if(e.key==='Enter')join();});
(()=>{
  if(typeof Peer==='undefined'){$('main').innerHTML='<div class="card note center">Couldn\'t load the multiplayer library. Check your connection and refresh.</div>';return;}
  const q=new URLSearchParams(location.search).get('join');
  if(q)startPlayer(q);else render();
})();
</script>
</body>
</html>
